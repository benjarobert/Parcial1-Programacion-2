<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festival de musica 2026</title>
</head>
<body>

    <nav class="Menu">
        <ul>
            <li><a href="#">Casa</a></li>
            <li><a href="#">Artistas Invitados</a></li>
            <li><a href="#">Tickets</a></li>
            <li><a href="#">Contactos</a></li>
        </ul>
    </nav>
    
    <section>
        <p>¡Cantantes invitados!</p>
        <div class="Galeria">
            
            <div class="tarjeta">
                <img src="./Imagenes/cantante-femenina-en-la-etapa.webp" alt="Cantante invitada numero 1">
            <h3>Artista Invitada: Ariana Grande</h3>
            </div>

            <div class="tarjeta">
                <img src="./Imagenes/el-cantante.webp" alt="Cantante invitado numero 2">
                <h3>Artista Invitado: Ed Sheeran</h3>
            </div>
        </div>
    </section>

    <section id="Reservas">
        <h2> Aca podes reservar tur tickets o consultar sobre los mismos</h2>

        <form class="Formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="cantidad">Cantidad de Tickets:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required>

            <button type="submit">Reservar</button>
        </form>
    </section>

    <section>
        
    </section>
</body>
</html>
